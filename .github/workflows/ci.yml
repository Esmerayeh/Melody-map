name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov

      - name: Run backend tests
        env:
          MONGODB_URI: mongodb://localhost:27017/melody_map_test
          SECRET_KEY: test-secret
          SPOTIFY_CLIENT_ID: dummy
          SPOTIFY_CLIENT_SECRET: dummy
          LASTFM_API_KEY: dummy
          LASTFM_API_SECRET: dummy
          FRONTEND_URL: http://localhost:3000
        run: pytest tests/ -v --cov=. --cov-report=xml

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend Build Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Authoritative frontend verification happens in CI because
      # sandboxed terminals can surface non-project Vite/esbuild spawn EPERM failures.
      - name: Run lint if present
        run: npm run lint --if-present

      - name: Run tests if present
        run: npm run test --if-present

      - name: Build frontend (authoritative CI check)
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-dist
          path: frontend/dist

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t melody-map-backend ./backend

      - name: Build frontend image
        run: docker build -t melody-map-frontend ./frontend
